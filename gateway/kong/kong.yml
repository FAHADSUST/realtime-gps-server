# Kong declarative configuration (DB-less mode).
#
# This file is the whole gateway: every service Kong can reach, every route it will accept, and the
# plugins applied to them. Nothing is configured through the Admin API at runtime, so the routing
# surface is reviewable in a pull request.
#
# Two rules hold for every edit:
#   1. No route may expose /api/v1/company/** or /api/v1/internal/**. Those are restricted endpoints
#      served only on each service's internal port. KongDeclarativeConfigTest enforces this.
#   2. Identity headers are removed from every incoming request before anything else runs. Only
#      rls_auth may set them, from values the Id service verified.

_format_version: "3.0"
_transform: true

services:
  - name: id-service
    # Resolved by Docker DNS inside the compose network. See "Upstream resolution" in the README for
    # the Consul DNS alternative used by the original AWS deployment.
    url: http://id-service:8081
    connect_timeout: 2000
    read_timeout: 10000
    write_timeout: 10000
    retries: 1
    routes:
      # Public: a client has no user yet, so this authenticates with the company's own credentials.
      - name: user-signup
        paths:
          - /api/v1/user/signup
        methods:
          - POST
        strip_path: false

      # Public: this is where a token comes from, so it cannot require one.
      - name: auth-token
        paths:
          - /api/v1/auth/token
        methods:
          - POST
        strip_path: false
        plugins:
          # This is the password-guessing surface of the whole platform, so it gets a much tighter
          # limit than everything else. Ten attempts a minute per IP is generous for a human and
          # useless for a dictionary.
          - name: rate-limiting
            config:
              minute: 10
              policy: local
              limit_by: ip
              fault_tolerant: true
              hide_client_headers: false

      # Protected: rls_auth resolves the token into the identity headers the service reads.
      - name: user-resolve
        paths:
          - /api/v1/user/resolve
        methods:
          - GET
        strip_path: false
        plugins:
          - name: rls_auth
            config:
              # The Id service's restricted port - /api/v1/internal/** is served only there.
              authenticate_url: http://id-service:9081/api/v1/internal/authenticate
              # Bounds how long a disabled user keeps working after being disabled.
              max_cache_ttl: 60
              negative_cache_ttl: 5

  - name: ping-service
    url: http://ping-service:8082
    connect_timeout: 2000
    read_timeout: 10000
    write_timeout: 10000
    retries: 1
    routes:
      # The platform's hot path: every device reporting its position lands here.
      - name: locations-submit
        paths:
          - /api/v1/locations
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rls_auth
            config:
              authenticate_url: http://id-service:9081/api/v1/internal/authenticate
              max_cache_ttl: 60
              negative_cache_ttl: 5

      # Users within a radius. Declared before the bare /api/v1/locations route for readability;
      # Kong matches the longer path first regardless.
      - name: locations-nearby
        paths:
          - /api/v1/locations/users
        methods:
          - GET
        strip_path: false
        plugins:
          - name: rls_auth
            config:
              authenticate_url: http://id-service:9081/api/v1/internal/authenticate
              max_cache_ttl: 60
              negative_cache_ttl: 5

      # Last known position of specific users.
      - name: locations-last
        paths:
          - /api/v1/locations
        methods:
          - GET
        strip_path: false
        plugins:
          - name: rls_auth
            config:
              authenticate_url: http://id-service:9081/api/v1/internal/authenticate
              max_cache_ttl: 60
              negative_cache_ttl: 5

plugins:
  # The trust boundary. A client must never be able to assert who it is, so these headers are
  # stripped from every request regardless of route; rls_auth re-adds them once verified.
  #
  # X-Gateway-Token proves to the services that a request came through Kong. It must match
  # gps.common.gateway.token in Consul KV (config/application/data). Local development value; a real
  # deployment templates this from a secret store.
  - name: request-transformer
    config:
      remove:
        headers:
          - X-Company-Id
          - X-User-Id
          - X-App-Key
          - X-Gateway-Token
      add:
        headers:
          - "X-Gateway-Token:local-dev-gateway-token"

  # One id per request, echoed to the client and carried into every service log line.
  - name: correlation-id
    config:
      header_name: X-Correlation-Id
      generator: uuid
      echo_downstream: true

  # A ceiling on what any single client can cost the platform. `policy: local` counts per Kong node,
  # which is exact while one node is deployed; with several, switch to `policy: redis` pointed at the
  # Redis already in the stack so the limit is shared.
  - name: rate-limiting
    config:
      minute: 600
      policy: local
      limit_by: ip
      # A rate limiter that cannot count must not become an outage.
      fault_tolerant: true
      hide_client_headers: false

  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PATCH
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - X-Correlation-Id
      exposed_headers:
        - X-Correlation-Id
      # Tokens travel in the Authorization header, not cookies, so credentialed CORS is not needed -
      # and allowing it alongside origins "*" is invalid anyway.
      credentials: false
      max_age: 3600

  # Kong's own request/latency/status metrics, scraped from the Admin API at /metrics.
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
