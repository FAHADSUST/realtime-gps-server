# Validates the on-prem platform code - Terraform, Ansible, the charts Argo CD deploys, alert rules,
# the log pipeline - with the same script developers run locally. Nothing here touches a cluster.
name: platform

"on":
  pull_request:
    paths:
      - infra/**
      - deploy/**
      - gateway/kong/**
      - scripts/**
      - .github/workflows/platform.yml
  push:
    branches: [main]
    paths:
      - infra/**
      - deploy/**
      - gateway/kong/**
      - scripts/**
      - .github/workflows/platform.yml

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

# The versions the platform was validated with. Downloads are checked against these checksums.
env:
  TERRAFORM_VERSION: 1.17.1
  HELM_VERSION: v4.3.1
  HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  PROMETHEUS_VERSION: 3.15.1
  PROMETHEUS_SHA256: 6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
  ALLOY_VERSION: v1.21.3
  ALLOY_SHA256: 50d23af2d0f98c00beac6ce9a365693e60f87fb76b6cad6fe1d161e80588af6d

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the Python tools
        run: >-
          pip install --no-cache-dir
          ansible-core==2.21.5 ansible-lint==26.10.1 yamllint==1.37.1 shellcheck-py==0.11.0.1
          pyyaml jinja2 passlib bcrypt

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Helm, kubeconform, promtool and Alloy
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin"
          mkdir -p "$bin" /tmp/tools
          cd /tmp/tools
          fetch() {  # url, file, sha256
            curl -fsSL -o "$2" "$1"
            echo "$3  $2" | sha256sum -c -
          }
          fetch "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" helm.tar.gz "$HELM_SHA256"
          tar -xzf helm.tar.gz && install linux-amd64/helm "$bin/helm"

          url="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          fetch "$url/kubeconform-linux-amd64.tar.gz" kubeconform.tar.gz "$KUBECONFORM_SHA256"
          tar -xzf kubeconform.tar.gz kubeconform && install kubeconform "$bin/kubeconform"

          prometheus="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          url="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
          fetch "$url/$prometheus.tar.gz" prometheus.tar.gz "$PROMETHEUS_SHA256"
          tar -xzf prometheus.tar.gz && install "$prometheus/promtool" "$bin/promtool"

          url="https://github.com/grafana/alloy/releases/download/${ALLOY_VERSION}"
          fetch "$url/alloy-linux-amd64.zip" alloy.zip "$ALLOY_SHA256"
          unzip -q alloy.zip && install alloy-linux-amd64 "$bin/alloy"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Validate the platform
        run: ./scripts/validate-platform.sh
