name: realtime-gps

# Local stand-in for the AWS infrastructure in the original spec:
#   RDS MySQL      -> mysql
#   ElastiCache    -> redis
#   EC2 RabbitMQ   -> rabbitmq
#   EC2 Consul     -> consul
# Services and Kong are added to this file by later commits.

services:
  mysql:
    image: mysql:8.0
    container_name: gps-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max_connections=500
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [gps-net]

  redis:
    image: redis:7-alpine
    container_name: gps-redis
    # noeviction: a silently evicted geo entry would mean a user vanishing from radius results.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [gps-net]

  rabbitmq:
    image: rabbitmq:4-management
    container_name: gps-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gps}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gps_pw}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [gps-net]

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:

networks:
  gps-net:
    name: gps-net
    driver: bridge
