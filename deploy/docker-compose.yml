name: realtime-gps

# Local stand-in for the AWS infrastructure in the original spec:
#   RDS MySQL      -> mysql
#   ElastiCache    -> redis
#   EC2 RabbitMQ   -> rabbitmq
#   EC2 Consul     -> consul
# Services and Kong are added to this file by later commits.

services:
  mysql:
    image: mysql:8.0
    container_name: gps-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max_connections=500
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [gps-net]

  redis:
    image: redis:7-alpine
    container_name: gps-redis
    # noeviction: a silently evicted geo entry would mean a user vanishing from radius results.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [gps-net]

  rabbitmq:
    image: rabbitmq:4-management
    container_name: gps-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gps}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gps_pw}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [gps-net]

  consul:
    image: hashicorp/consul:1.20
    container_name: gps-consul
    # -dev keeps config + registrations in memory; scripts/up.sh re-seeds the KV on every start.
    command: ["agent", "-dev", "-node=gps-consul", "-client=0.0.0.0", "-ui"]
    ports:
      - "${CONSUL_HTTP_PORT:-8500}:8500"
      - "${CONSUL_DNS_PORT:-8600}:8600/tcp"
      - "${CONSUL_DNS_PORT:-8600}:8600/udp"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [gps-net]

  id-service:
    build:
      context: ../services/id-service
      dockerfile: Dockerfile
    image: gps/id-service:local
    container_name: gps-id-service
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: gps_id
      MYSQL_USER: gps_id
      MYSQL_PASSWORD: gps_id_pw
      SERVER_PORT: 8081
      INTERNAL_PORT: 9081
    ports:
      # 8081 is the public port Kong proxies to; 9081 serves the restricted endpoints and is
      # published here only so you can exercise them from your machine.
      - "${ID_SERVICE_PORT:-8081}:8081"
      - "${ID_SERVICE_INTERNAL_PORT:-9081}:9081"
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped
    networks: [gps-net]

  ping-service:
    build:
      context: ../services/ping-service
      dockerfile: Dockerfile
    image: gps/ping-service:local
    container_name: gps-ping-service
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      SERVER_PORT: 8082
    ports:
      - "${PING_SERVICE_PORT:-8082}:8082"
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped
    networks: [gps-net]

  kong:
    image: kong:3.9
    container_name: gps-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      # Custom plugin: Kong loads kong.plugins.rls_auth from the mounted package path.
      KONG_PLUGINS: bundled,rls_auth
      KONG_LUA_PACKAGE_PATH: /opt/kong-plugins/?.lua;;
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ../gateway/kong/kong.yml:/kong/declarative/kong.yml:ro
      # Kong resolves kong.plugins.rls_auth against KONG_LUA_PACKAGE_PATH, hence the kong/plugins tail.
      - ../gateway/kong/plugins:/opt/kong-plugins/kong/plugins:ro
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      # Admin API is bound to the loopback interface only: it can rewrite the whole gateway.
      - "127.0.0.1:${KONG_ADMIN_PORT:-8001}:8001"
    depends_on:
      id-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [gps-net]

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:

networks:
  gps-net:
    name: gps-net
    driver: bridge
