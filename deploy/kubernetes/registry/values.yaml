# Set by the Argo CD Application from the cluster's settings; the defaults only let `helm template`
# render the chart on its own.
cluster:
  domain: rls.internal
  issuer: rls-ca
  monitoringNamespace: monitoring

image: registry:3.1.2

# Every image of every release lives here until garbage-collected (see docs/on-prem/09-application.md).
storage:
  size: 20Gi
  storageClass: longhorn

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
