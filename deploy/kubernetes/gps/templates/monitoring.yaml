# Metrics for Prometheus, alert rules, and a Grafana dashboard - all discovered automatically by the
# monitoring stack.
{{- range $name, $svc := .Values.services }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    {{- include "gps.labels" (dict "name" $name) | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
{{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kong
  labels:
    {{- include "gps.labels" (dict "name" "kong") | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kong
  endpoints:
    - port: status
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq
  labels:
    {{- include "gps.labels" (dict "name" "rabbitmq") | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gps
  labels:
    {{- include "gps.labels" (dict "name" "gps-alerts") | nindent 4 }}
spec:
  groups:
    {{- .Files.Get "files/alerts.yaml" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gps-dashboard
  labels:
    {{- include "gps.labels" (dict "name" "gps-dashboard") | nindent 4 }}
    # Picked up by Grafana's dashboard sidecar, which searches every namespace.
    grafana_dashboard: "1"
data:
  gps-overview.json: |
    {{- .Files.Get "files/dashboard.json" | nindent 4 }}
