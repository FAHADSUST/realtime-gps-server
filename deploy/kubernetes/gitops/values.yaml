# The root Application, created by Ansible, sets `cluster` and `gitops` from the inventory. The
# defaults below only let `helm template` render the chart on its own.
cluster:
  name: rls-onprem
  domain: rls.internal
  issuer: rls-ca
  monitoringNamespace: monitoring
  podCidr: 10.244.0.0/16

gitops:
  repoURL: https://github.com/FAHADSUST/realtime-gps-server.git
  targetRevision: main

# What the applications in the `platform` project may use besides the Git repository above and the
# monitoring namespace: these Helm repositories and namespaces. Each application adds what it needs.
project:
  helmRepositories:
    - https://prometheus-community.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    # Alloy is still published here by Grafana Labs.
    - https://grafana.github.io/helm-charts
  namespaces:
    # kube-prometheus-stack adds Services there to scrape the control plane.
    - kube-system
    - registry
    - gps

# One entry per Application. Chart versions are pinned here; static chart values live in values/,
# cluster-specific ones are set in the Application templates.
apps:
  kubePrometheusStack:
    enabled: true
    # Prometheus Operator v0.94.2, the same as the CRDs Ansible installs (prometheus-operator-crds).
    chartVersion: 92.17.0
  grafana:
    enabled: true
    # Grafana 13.3.0. Grafana's own grafana/grafana chart is deprecated; the community maintains it.
    chartVersion: 14.3.0
  loki:
    enabled: true
    # Loki 3.7.9 (grafana-community; grafana/loki now targets Grafana Enterprise Logs).
    chartVersion: 20.2.1
  alloy:
    enabled: true
    # Alloy v1.21.3.
    chartVersion: 1.15.0
  # deploy/kubernetes/registry in this repository; its version is the image in that chart.
  registry:
    enabled: true
  # deploy/kubernetes/gps in this repository. A release is a Git change: publish the images
  # (scripts/publish-images.sh), then set imageTag to the tag it printed. Off until the first
  # release exists - without images the pods could not start.
  gps:
    enabled: false
    imageTag: ""
