# Infrastructure endpoints come from the environment (they differ between a container and a
# host JVM); behaviour and tuning come from Consul KV at config/ping-service/data.

spring:
  application:
    name: ping-service

  config:
    import: "optional:consul:${CONSUL_HOST:localhost}:${CONSUL_PORT:8500}"

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      config:
        enabled: true
        format: yaml
        prefix: config
        default-context: application
        data-key: data
        fail-fast: false
        watch:
          enabled: true
          delay: 10000
      discovery:
        enabled: true
        register: true
        fail-fast: false
        prefer-ip-address: true
        instance-id: ${spring.application.name}-${random.value}
        health-check-path: /actuator/health
        health-check-interval: 10s

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short: this sits on the hot write path, so a slow Redis must fail fast rather than queue up.
      timeout: 2s
      connect-timeout: 2s

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

gps:
  ping:
    redis:
      key-prefix: gps
      # How long a silent user stays visible to radius queries.
      last-location-ttl: 24h

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.rls.gps: INFO
