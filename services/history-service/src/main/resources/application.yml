# Infrastructure endpoints come from the environment; behaviour and tuning come from Consul KV at
# config/history-service/data.

spring:
  application:
    name: history-service

  config:
    import: "optional:consul:${CONSUL_HOST:localhost}:${CONSUL_PORT:8500}"

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      config:
        enabled: true
        format: yaml
        prefix: config
        default-context: application
        data-key: data
        fail-fast: false
        watch:
          enabled: true
          delay: 10000
      discovery:
        enabled: true
        register: true
        fail-fast: false
        prefer-ip-address: true
        instance-id: ${spring.application.name}-${random.value}
        health-check-path: /actuator/health
        health-check-interval: 10s

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:gps}
    password: ${RABBITMQ_PASSWORD:gps_pw}
    listener:
      simple:
        # AUTO: the container acks when the listener returns and rejects when it throws.
        acknowledge-mode: auto
        # Batches are large, so a small prefetch is plenty and keeps work spread across consumers.
        prefetch: 4
        concurrency: 2
        max-concurrency: 8
        # Never requeue a rejected batch: without this a failing message loops forever, being
        # redelivered to the same code that just failed on it. It goes to the dead-letter queue.
        default-requeue-rejected: false

  datasource:
    # rewriteBatchedStatements is what makes a batch insert one statement instead of N round trips;
    # without it the consumer's throughput collapses to one insert per fix.
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:gps_history}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
    username: ${MYSQL_USER:gps_history}
    password: ${MYSQL_PASSWORD:gps_history_pw}
    hikari:
      pool-name: history-hikari
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.rls.gps: INFO
