---
# The whole pipeline, in order. Every play is tagged so one layer can be re-run on its own:
#
#   ansible-playbook site.yml                   # everything
#   ansible-playbook site.yml --tags kubeadm    # one layer
#   ansible-playbook site.yml --limit wk-04     # bring a new node in
#
# Tags in pipeline order: nodes, kubeadm, crds, cilium, metallb, longhorn.

- name: Prepare every node
  hosts: k8s_cluster
  become: true
  roles:
    - role: node_baseline
    - role: containerd
    - role: kubernetes_packages
  tags: [nodes]

- name: Initialise the cluster on the first control plane
  hosts: control_plane[0]
  become: true
  roles:
    - role: kubeadm_init
  tags: [kubeadm]

# One at a time: each join adds an etcd member, and etcd must reach quorum between additions.
- name: Join the other control planes
  hosts: control_plane[1:]
  serial: 1
  become: true
  roles:
    - role: kubeadm_join
  tags: [kubeadm]

- name: Join the workers
  hosts: workers
  become: true
  roles:
    - role: kubeadm_join
  tags: [kubeadm]

- name: Install kubectl access and Helm on the control planes
  hosts: control_plane
  become: true
  roles:
    - role: control_plane_tools
  tags: [kubeadm]

- name: Install the Prometheus Operator CRDs
  hosts: control_plane[0]
  become: true
  roles:
    - role: prometheus_operator_crds
  tags: [crds]

- name: Install the pod network
  hosts: control_plane[0]
  become: true
  roles:
    - role: cilium
  tags: [cilium]

- name: Install MetalLB
  hosts: control_plane[0]
  become: true
  roles:
    - role: metallb
  tags: [metallb]

- name: Prepare the workers for Longhorn
  hosts: workers
  become: true
  roles:
    - role: longhorn_node
  tags: [longhorn]

- name: Install Longhorn
  hosts: control_plane[0]
  become: true
  roles:
    - role: longhorn
  tags: [longhorn]
