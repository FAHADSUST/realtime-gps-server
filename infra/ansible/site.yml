---
# The whole pipeline, in order. Every play is tagged so one layer can be re-run on its own:
#
#   ansible-playbook site.yml                   # everything
#   ansible-playbook site.yml --tags kubeadm    # one layer
#   ansible-playbook site.yml --limit wk-04     # bring a new node in
#
# Tags in pipeline order: nodes, kubeadm, backup, crds, cilium, metallb, longhorn, ingress, tls,
# ops-ui, secrets, argocd.
# Once group_vars/all/vault.yml exists (the ops-ui layer needs it), every run needs the vault
# password: add --ask-vault-pass.

- name: Prepare every node
  hosts: k8s_cluster
  become: true
  roles:
    - role: node_baseline
    - role: containerd
    - role: kubernetes_packages
  tags: [nodes]

- name: Initialise the cluster on the first control plane
  hosts: control_plane[0]
  become: true
  roles:
    - role: kubeadm_init
  tags: [kubeadm]

# One at a time: each join adds an etcd member, and etcd must reach quorum between additions.
- name: Join the other control planes
  hosts: control_plane[1:]
  serial: 1
  become: true
  roles:
    - role: kubeadm_join
  tags: [kubeadm]

- name: Join the workers
  hosts: workers
  become: true
  roles:
    - role: kubeadm_join
  tags: [kubeadm]

- name: Install kubectl access and Helm on the control planes
  hosts: control_plane
  become: true
  roles:
    - role: control_plane_tools
  tags: [kubeadm]

- name: Back up etcd every night on each control plane
  hosts: control_plane
  become: true
  roles:
    - role: etcd_backup
  tags: [backup]

- name: Install the Prometheus Operator CRDs
  hosts: control_plane[0]
  become: true
  roles:
    - role: prometheus_operator_crds
  tags: [crds]

- name: Install the pod network
  hosts: control_plane[0]
  become: true
  roles:
    - role: cilium
  tags: [cilium]

- name: Install MetalLB
  hosts: control_plane[0]
  become: true
  roles:
    - role: metallb
  tags: [metallb]

- name: Prepare the workers for Longhorn
  hosts: workers
  become: true
  roles:
    - role: longhorn_node
  tags: [longhorn]

- name: Install Longhorn
  hosts: control_plane[0]
  become: true
  roles:
    - role: longhorn
  tags: [longhorn]

- name: Install Ingress-NGINX
  hosts: control_plane[0]
  become: true
  roles:
    - role: ingress_nginx
  tags: [ingress]

- name: Install cert-manager and the cluster CA
  hosts: control_plane[0]
  become: true
  roles:
    - role: cert_manager
  tags: [tls]

- name: Trust the cluster CA on every node
  hosts: k8s_cluster
  become: true
  roles:
    - role: cluster_ca_trust
  tags: [tls]

- name: Publish the operator UIs
  hosts: control_plane[0]
  become: true
  roles:
    - role: ops_ui
  tags: [ops-ui]

# Before Argo CD: the applications it deploys reference these by name from their first sync.
- name: Write the secrets Argo CD applications use
  hosts: control_plane[0]
  become: true
  roles:
    - role: platform_secrets
  tags: [secrets]

- name: Install Argo CD
  hosts: control_plane[0]
  become: true
  roles:
    - role: argocd
  tags: [argocd]
