---
# The whole pipeline, in order. Every play is tagged so one layer can be re-run on its own:
#
#   ansible-playbook site.yml                 # everything
#   ansible-playbook site.yml --tags nodes    # just node preparation

- name: Prepare every node
  hosts: k8s_cluster
  become: true
  roles:
    - role: node_baseline
    - role: containerd
    - role: kubernetes_packages
  tags: [nodes]

- name: Initialise the cluster on the first control plane
  hosts: control_plane[0]
  become: true
  roles:
    - role: kubeadm_init
  tags: [kubeadm]

# One at a time: each join adds an etcd member, and etcd must reach quorum between additions.
- name: Join the other control planes
  hosts: control_plane[1:]
  serial: 1
  become: true
  roles:
    - role: kubeadm_join
  tags: [kubeadm]

- name: Join the workers
  hosts: workers
  become: true
  roles:
    - role: kubeadm_join
  tags: [kubeadm]
