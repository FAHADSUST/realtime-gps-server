---
- name: Install MetalLB
  kubernetes.core.helm:
    name: metallb
    chart_ref: metallb
    chart_repo_url: "{{ metallb_chart_repo }}"
    chart_version: "{{ metallb_chart_version }}"
    release_namespace: metallb-system
    create_namespace: true
    kubeconfig: "{{ kubeconfig_path }}"
    release_values: "{{ lookup('ansible.builtin.template', 'values.yaml.j2') | from_yaml }}"
    wait: true
    timeout: 5m

# The pools are custom resources checked by MetalLB's webhook, which is ready once the release is.
- name: Configure the address pools
  ansible.builtin.include_role:
    name: kubectl_apply
  vars:
    kubectl_apply_name: MetalLB address pools
    kubectl_apply_manifest: "{{ lookup('ansible.builtin.template', 'address-pools.yaml.j2') }}"
