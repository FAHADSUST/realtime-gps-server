---
- name: Check that no secret still holds an example placeholder
  ansible.builtin.assert:
    that: >-
      platform_secrets_list | map(attribute='data') | map('dict2items') | flatten
      | map(attribute='value') | map('string') | select('search', 'CHANGE-ME') | list | length == 0
    fail_msg: >-
      A platform secret still holds CHANGE-ME. Fill in every value in
      inventory/group_vars/all/vault.yml (docs/on-prem/02-ansible.md, "Secrets").
    quiet: true
  no_log: true

- name: Write the secrets Argo CD applications use
  ansible.builtin.include_role:
    name: kubectl_apply
  vars:
    kubectl_apply_name: platform secrets
    kubectl_apply_manifest: "{{ lookup('ansible.builtin.template', 'secrets.yaml.j2') }}"
    kubectl_apply_no_log: true
