---
node_baseline_packages:
  - ca-certificates
  - curl
  - gpg
  # Not needed by kubeadm 1.36, whose preflight checks only look for losetup, mount and cp (all in
  # the base image), but the first tools anyone reaches for when debugging a node or the pod network.
  - conntrack
  - ethtool
  - iptables
  - jq
  - socat
  - tcpdump

# NTP servers for systemd-timesyncd. Empty keeps the distribution default. Certificates and etcd
# both misbehave on clocks that drift, so point this at your own time source if you have one.
node_baseline_ntp_servers: []

# Kernel tunables for a Kubernetes node.
node_baseline_sysctls:
  net.ipv4.ip_forward: 1
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  # Log shippers and the kubelet watch thousands of files; the defaults run out.
  fs.inotify.max_user_watches: 524288
  fs.inotify.max_user_instances: 512
