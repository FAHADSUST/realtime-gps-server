---
- name: Create the backup directory
  ansible.builtin.file:
    path: "{{ etcd_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install the snapshot script
  ansible.builtin.copy:
    src: etcd-snapshot
    dest: /usr/local/sbin/etcd-snapshot
    owner: root
    group: root
    mode: "0750"

- name: Install the snapshot service and its timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - etcd-snapshot.service
    - etcd-snapshot.timer

- name: Schedule the snapshots
  ansible.builtin.systemd_service:
    name: etcd-snapshot.timer
    enabled: true
    state: started
    daemon_reload: true
