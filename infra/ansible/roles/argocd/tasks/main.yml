---
- name: Check that the Argo CD admin password is in the vault
  ansible.builtin.assert:
    that:
      - vault_argocd_admin_password_bcrypt is defined
      - vault_argocd_admin_password_bcrypt is match('^[$]2[aby][$]')
    fail_msg: >-
      vault_argocd_admin_password_bcrypt must be a bcrypt hash. Create inventory/group_vars/all/vault.yml
      from inventory/vault.example.yml (docs/on-prem/02-ansible.md, "Secrets").
    quiet: true

- name: Install Argo CD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo-cd
    chart_repo_url: "{{ argocd_chart_repo }}"
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: argocd
    create_namespace: true
    kubeconfig: "{{ kubeconfig_path }}"
    release_values: "{{ lookup('ansible.builtin.template', 'values.yaml.j2') | from_yaml }}"
    wait: true
    timeout: 10m
  no_log: true

- name: Give Argo CD read access to the GitOps repository
  ansible.builtin.include_role:
    name: kubectl_apply
  vars:
    kubectl_apply_name: GitOps repository credentials
    kubectl_apply_manifest: "{{ lookup('ansible.builtin.template', 'repository-secret.yaml.j2') }}"
    kubectl_apply_no_log: true
  when: vault_gitops_repo_password is defined

- name: Hand the platform over to Git
  ansible.builtin.include_role:
    name: kubectl_apply
  vars:
    kubectl_apply_name: root application
    kubectl_apply_manifest: "{{ lookup('ansible.builtin.template', 'root-application.yaml.j2') }}"

# Fails if Argo CD cannot read deploy/kubernetes/gitops at gitops_revision - the repository is
# unreachable, private without credentials, or the branch does not have the chart yet.
- name: Wait for Argo CD to sync the platform from Git
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig={{ kubeconfig_path }}
      - --namespace=argocd
      - wait
      - application/gitops
      - --for=jsonpath={.status.sync.status}=Synced
      - --timeout=5m
  changed_when: false
