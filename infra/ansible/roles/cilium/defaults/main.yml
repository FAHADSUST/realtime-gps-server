---
# Chart repository. Point it at an internal Helm repository when nodes cannot reach the internet.
cilium_chart_repo: https://helm.cilium.io

# native: pod traffic is routed between nodes as is, with a route per node's pod CIDR. Fastest,
# and right when every node shares one L2 segment - which the Terraform address plan guarantees.
# tunnel: VXLAN between nodes, for nodes spread across routed subnets.
cilium_routing_mode: native

# Hubble metrics exported to Prometheus. Flow-level detail (http, dns) needs L7 visibility
# through a network policy; without one those series stay empty.
cilium_hubble_metrics:
  - dns
  - drop
  - tcp
  - flow
  - port-distribution
  - icmp
  - "httpV2:exemplars=true;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction"
