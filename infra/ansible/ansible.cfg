[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
forks = 20
timeout = 30
interpreter_python = auto_silent
callback_result_format = yaml
# Show which host is slow without needing -v.
callbacks_enabled = ansible.posix.profile_tasks

[ssh_connection]
pipelining = True
# accept-new trusts a host the first time it is seen - Terraform just created it - but still
# refuses a host whose key later changes. Turning host key checking off would accept both.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
