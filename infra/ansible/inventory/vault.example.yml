---
# Every secret the platform needs - and the only place one lives. Copy this file into group_vars,
# replace every value, and encrypt it before anything else:
#
#   cp inventory/vault.example.yml inventory/group_vars/all/vault.yml
#   ansible-vault encrypt inventory/group_vars/all/vault.yml
#
# group_vars/all/vault.yml is git-ignored. Playbooks then need the vault password: pass
# --ask-vault-pass, or keep it in a file outside git and set ANSIBLE_VAULT_PASSWORD_FILE.
# This example sits outside group_vars on purpose, so its placeholders are never loaded.

# Basic authentication for the operator UIs without a login of their own (Hubble, Longhorn,
# Prometheus, Alertmanager): htpasswd lines, one per person. Create one with
#   htpasswd -nB ops                              (bcrypt; from apache2-utils / httpd-tools)
#   printf 'ops:%s\n' "$(openssl passwd -apr1)"   (where htpasswd is not available)
vault_ops_ui_htpasswd: |
  ops:CHANGE-ME

# Argo CD's local admin account, as a bcrypt hash. Create one with
#   argocd account bcrypt --password '<password>'
#   htpasswd -nbBC 10 '' '<password>' | tr -d ':\n' | sed 's/^\$2y/$2a/'
vault_argocd_admin_password_bcrypt: CHANGE-ME

# Grafana's admin account (user "admin"). Any strong password, e.g. openssl rand -base64 24
vault_grafana_admin_password: CHANGE-ME

# Only if gitops_repo_url is a private repository: a user and a read-only access token.
# vault_gitops_repo_username: CHANGE-ME
# vault_gitops_repo_password: CHANGE-ME
